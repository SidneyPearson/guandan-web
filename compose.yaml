services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      ONLINE_MODES: public
      DATA_DIR: /data
      PUBLIC_URL: https://${GUANDAN_DOMAIN:?请在 .env 中填写 GUANDAN_DOMAIN}
      ALLOWED_ORIGINS: https://${GUANDAN_DOMAIN:?请在 .env 中填写 GUANDAN_DOMAIN}
    volumes:
      - game-data:/data
    expose:
      - "8080"
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GUANDAN_DOMAIN: ${GUANDAN_DOMAIN:?请在 .env 中填写 GUANDAN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - game
volumes:
  game-data:
  caddy-data:
  caddy-config:
